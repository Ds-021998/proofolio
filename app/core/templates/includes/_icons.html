{% comment %}
  Icon sprite. Included once in base.html, referenced anywhere with:

      <svg width="12" height="12" aria-hidden="true"><use href="#ico-check"></use></svg>

  Every icon is decorative — the adjacent text carries the meaning — so each
  use site sets aria-hidden="true". Never use an icon as the only indicator
  of status.
{% endcomment %}
<svg hidden aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ico-check" viewBox="0 0 16 16" fill="none">
    <path d="M3 8.5l3.2 3.2L13 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="ico-dot" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="4" fill="currentColor"/>
  </symbol>
  <symbol id="ico-alert" viewBox="0 0 16 16" fill="none">
    <path d="M8 2.6l5.8 10.1H2.2L8 2.6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M8 6.6v3M8 11.4v.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </symbol>
  <symbol id="ico-seal" viewBox="0 0 16 16" fill="none">
    <path d="M8 1.4l1.7 1.2 2-.2.7 1.9 1.7 1.1-.7 1.9.7 1.9-1.7 1.1-.7 1.9-2-.2L8 14.2l-1.7-1.2-2 .2-.7-1.9L1.9 10l.7-1.9-.7-1.9 1.7-1.1.7-1.9 2 .2L8 1.4z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M5.6 8.1l1.7 1.7 3.1-3.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
