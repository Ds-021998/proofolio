<script>
  // ---------------------------------------------------------------- content
  const BRIEF = `COMP7110 Assignment 2 — Solution validation report (25%)
Due Friday week 10, 4pm, via Blackboard.

In no more than 2000 words, report the second iteration of your Business Model
Canvas. You must: restate the problem you are solving and who has it; list the
hypotheses you tested this iteration and how you tested them; present the
evidence from your own interviews; show what changed in the canvas and why; and
justify your value proposition against the pains your interviewees named.

Marked against the course rubric: problem framing, experiment design, evidence,
iteration, business model. AI-generated interview data is not permitted.`;

  const TEMPLATE = [
    {
      id: "CP-01",
      title: "Problem statement names a person, not a group",
      criterion: "Problem framing",
      clause:
        "The problem is stated as a specific person, a specific task, the constraint that blocks them, and what they do today instead.",
      good: "A reader can name someone you could email this afternoon.",
      flaw: "The problem statement names a group (“students”), and the current-workaround clause is missing.",
      why: "Without a workaround there is no evidence that anyone feels this problem enough to have acted on it already.",
      action:
        "Rewrite as: [person] struggles to [task] because [constraint], and today they cope by [workaround]. Fill the last clause from an interview quote.",
      para: 1,
    },
    {
      id: "CP-02",
      title: "Every hypothesis states what would kill it",
      criterion: "Experiment design",
      clause: "Each hypothesis is paired with a test and the observation that would disprove it.",
      good: "For each hypothesis, a reader can say what result would end it.",
      flaw: "Three hypotheses are listed. None states the result that would disprove it.",
      why: "A hypothesis that cannot fail is a belief, and its test card cannot be scored either way.",
      action: "Add one “killed if” line per hypothesis, naming an observation rather than an opinion.",
      para: 2,
    },
    {
      id: "CP-03",
      title: "Interview evidence is quoted and attributed",
      criterion: "Evidence",
      clause: "Claims about users are supported by attributed quotes from the team's own interviews.",
      good: "Every user claim traces to a participant code, a date, and the member who ran the interview.",
      flaw: "Findings are paraphrased in the team's words. One interview is quoted; none is attributed to the member who ran it.",
      why: "Iteration 1 lost this criterion for exactly this reason — interviews appeared under the wrong member's name.",
      action: "Attach participant code, date and interviewer to each finding, and quote at least one line per claim.",
      para: 3,
    },
    {
      id: "CP-04",
      title: "Canvas changes trace to a learning card",

  function structureCheck(text, cp) {
    const t = text.trim();
    const words = t ? t.split(/\s+/).length : 0;
    const has = {
      implication: /\b(suggests?|implies|because|therefore|which means|indicates?|as a result|so that)\b/i.test(t),
      quote: /["“”]|\b(participant|interviewee|P\d|respondent)\b/i.test(t),
      specific: /\b(one|a|the)\s+(tutor|student|marker|coordinator|participant)\b/i.test(t) || /\bP\d\b/.test(t),
      hedge: /\b(some|many|often|people|generally|a lot of|students often)\b/i.test(t),
      killed: /\b(killed if|disprove|falsif|would fail|if fewer|if no one)\b/i.test(t),
      trace: /\b(learning card|LC-?\d|test card|TC-?\d|iteration 1)\b/i.test(t),
    };
    const rules = {
      "CP-01": [
        [has.specific && !has.hedge, "Names a specific person rather than a group", "Who exactly? Replace “students” with one person you interviewed."],
        [/\bbecause\b|\bcannot\b|\bblocked\b/i.test(t), "States the constraint", "What stops them — time, money, permission, information?"],
        [/\b(today|currently|instead|they cope|workaround|they use)\b/i.test(t), "States what they do today instead", "What is their current workaround? Without it, the problem may just be tolerated."],
      ],
      "CP-02": [
        [has.killed, "States a falsification condition", "What observation would end this hypothesis? Write the “killed if” line."],
        [/\b(we asked|test|interview|we will)\b/i.test(t), "Names how it was tested", "How was it tested, and on whom?"],
      ],
      "CP-03": [
        [has.quote, "Contains a quote or participant reference", "Quote one line. A paraphrase is your words, not theirs."],
        [/\b(P\d|\d{1,2}\s?(Aug|Sep|Oct|Nov)|interviewed by)\b/i.test(t), "Attributes the evidence", "Add participant code, date, and who ran the interview."],
      ],
      "CP-04": [
        [has.trace, "Cites the learning card behind the change", "Which learning card caused this change? Name its ID."],
        [/\b(changed|revised|updated|moved)\b/i.test(t), "Names what changed", "Say which canvas block changed, not just that the canvas changed."],
      ],
      "CP-05": [
        [has.quote || has.specific, "Anchors to a pain someone named", "Which interviewee named this pain? If none did, it is a team idea."],
        [has.implication, "Links the reliever to the pain", "Say how the reliever removes that specific pain."],
      ],
    };
    const checks = rules[cp.id] || [];
    return { words, checks };
  }

          <label class="row small" style="gap:8px">
            <input type="checkbox" data-act="cpvisible" data-cp="${c.id}" ${c.visible ? "checked" : ""} />
            <span>Visible to students before they submit</span>
          </label>
          ${
            !c.visible
              ? `<p class="callout">Hidden. Students will be marked against a standard they were never shown — UQ requires published criteria, and hiding them reproduces the guesswork this tool exists to remove. Keep the <em>judgements</em> private, not the standard.</p>`
              : ""
          }
        </article>`
      )
      .join("");

    return `
      <div class="view-head">
        <p class="eyebrow">COMP7110 · Assignment 2 · 42 enrolled</p>
        <h1>Set the checkpoints once</h1>
        <p class="lede">Ten minutes here replaces a paragraph of typing on every one of 42 scripts. The checkpoints are also what the student sees before they start, and what carries into the next assignment.</p>
      </div>
      ${researchBlock()}
      <div class="stack">
        <section class="panel stack-sm">
          <div class="spread"><h2>Assignment brief</h2><span class="tiny">Paste or edit</span></div>
          <textarea rows="7" data-act="brief">${esc(state.brief)}</textarea>
          <button class="btn btn-primary" type="button" data-act="generate">${
            generated ? "Regenerate checkpoints from brief" : "Draft checkpoints from brief"
          }</button>
          <p class="tiny">Drafted from the brief and the course rubric. You edit them — the draft is a starting point, not a decision.</p>
        </section>

        ${
          generated
            ? `<section class="stack-sm">
                 <div class="spread"><h2>Checkpoints</h2><span class="num">${state.checkpoints.length} set</span></div>
                 ${cards}
                 <button class="btn btn-secondary" type="button" data-act="addcp">Add a checkpoint</button>
                 <button class="btn btn-primary btn-full" type="button" data-act="publish">${
                   state.published ? "Update what students see" : "Publish to students"
                 }</button>
               </section>`
            : `<div class="empty"><p>No checkpoints yet. Draft them from the brief above, then edit.</p></div>`
        }
      </div>`;
  }

  function viewMark() {
    if (!state.published) {
      return `<div class="view-head"><h1>Publish checkpoints first</h1><p class="lede">Marking is anchored to checkpoints, so they have to exist before a script can be marked.</p></div>
        ${researchBlock()}
        <div class="empty"><button class="btn btn-primary" type="button" data-act="view" data-view="setup">Go to setup</button></div>`;
    }
    if (!state.submitted) {
      return `<div class="view-head"><h1>No submission yet</h1><p class="lede">Switch to the student role and submit Assignment 2 to mark it here.</p></div>
        ${researchBlock()}
        <div class="empty"><button class="btn btn-primary" type="button" data-act="role" data-role="student">Switch to student</button></div>`;
    }

    const flagged = {};
    state.checkpoints.forEach((c) => {
      if (state.marks[c.id] && state.marks[c.id] !== "met") flagged[c.para] = true;
    });

    const script = state.draft
      .map(
        (p, i) =>
          `<div class="para" data-flagged="${!!flagged[i + 1]}"><span class="pno">P${i + 1}</span><p>${esc(p)}</p></div>`
      )
      .join("");

    const rows = state.checkpoints
      .map((c) => {
        const v = state.marks[c.id];
        return `<article class="cp verdict ${v || ""}">
            <div class="spread"><span class="cp-id">${c.id} · P${c.para}</span><span class="criterion"><strong>${esc(
          c.criterion
        )}</strong></span></div>
            <p class="cp-title">${esc(c.title)}</p>
            <div class="verdict-set" role="group" aria-label="Verdict for ${c.id}">
              <button type="button" data-act="verdict" data-cp="${c.id}" data-v="met" aria-pressed="${
          v === "met"
        }">Met</button>
              <button type="button" data-act="verdict" data-cp="${c.id}" data-v="partly" aria-pressed="${
          v === "partly"
        }">Partly</button>
              <button type="button" data-act="verdict" data-cp="${c.id}" data-v="miss" aria-pressed="${
          v === "miss"
        }">Not met</button>
            </div>
            ${
              v && v !== "met"
                ? `<div><p class="label">Comment sent to the student — edit if you want</p>
                     <textarea rows="3" data-act="comment" data-cp="${c.id}">${esc(
                    state.comments[c.id] || ""
                  )}</textarea></div>`
                : ""
            }
          </article>`;
      })
      .join("");

    const done = markedVerdicts().length;
    return `
      <div class="view-head">
        <p class="eyebrow">Script 19 of 42 · anonymous marking</p>
        <h1>Mark against the checkpoints</h1>
        <p class="lede">Choosing “not met” attaches the comment you already wrote at setup. You edit it only where this script needs something different.</p>
      </div>
      ${researchBlock()}
      <div class="stack">
        <div class="panel-quiet spread">
          <span class="timer">Time on this script <strong id="timer">0:00</strong></span>
          <span class="num">${done} / ${state.checkpoints.length} judged</span>
        </div>
        <section class="panel stack-sm">
          <div class="spread"><h2>Submission</h2><span class="tiny">Flagged paragraphs highlight as you mark</span></div>
          <div class="script">${script}</div>
        </section>
        <section class="stack-sm">${rows}</section>
        <button class="btn btn-primary btn-full" type="button" data-act="release" ${
          done < state.checkpoints.length ? "disabled" : ""
        }>${state.released ? "Feedback released" : "Release feedback to student"}</button>
        ${
          done < state.checkpoints.length
            ? `<p class="tiny">Judge every checkpoint to release. A partial release is how a student ends up guessing again.</p>`
            : ""
        }
      </div>`;
  }

  function viewCohort() {
    const total = 42;
    const rows = TEMPLATE.map((c) => {
      const n = COHORT[c.id] + (state.released && state.marks[c.id] && state.marks[c.id] !== "met" ? 1 : 0);
      const pct = Math.round((n / total) * 100);
      return `<div class="bar-row">
          <div class="spread"><span class="small"><span class="cp-id">${c.id}</span> ${esc(
        c.title
      )}</span><span class="num">${n}/${total} · ${pct}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>`;
    }).join("");

    return `
      <div class="view-head">
        <p class="eyebrow">COMP7110 · Assignment 2 · coordinator view</p>
        <h1>Where the cohort is losing marks</h1>
        <p class="lede">A mark distribution shows the shape. This shows the causes, while there is still teaching time left in the semester.</p>
      </div>
      ${researchBlock()}
      <div class="stack">
        <section class="panel">${rows}</section>
        <section class="panel stack-sm">
          <h2>Carry to next semester</h2>
          <p class="small muted">Eight sessional tutors marked this assignment. Seven will not teach the course again. This note is attached to the checkpoint, not to a person.</p>
          <textarea rows="3" data-act="handover" placeholder="e.g. CP-05 fails because the lecture example shows relievers without pains. Fix the example in week 6, not the rubric.">${esc(
            state.handover || ""
          )}</textarea>
          <button class="btn btn-secondary btn-sm" type="button" data-act="savehandover">Attach to checkpoint set</button>
        </section>
        <p class="callout">This screen is the one the course coordinator cares about, and the one no existing marking tool produces. It is also the weakest-tested part of the concept — nobody on the team has interviewed a coordinator yet.</p>
      </div>`;
  }

  function viewQuestions() {
    if (!state.questions.length) return `<div class="empty"><p>No questions.</p></div>`;
    const cards = state.questions
      .map((q) => {
        const c = cpById(q.cp);
        if (q.answered)
          return `<article class="qa">
              <div class="spread"><span class="cp-id">${q.cp} · ${esc(q.from)}</span><span class="pill met">Answered in ${
            q.seconds
          }s</span></div>
              <p class="small"><strong>Q:</strong> ${esc(q.text)}</p>
              <p class="small muted">${esc(q.answer)}</p>
            </article>`;
        return `<article class="qa">
            <div class="spread"><span class="cp-id">${q.cp} · ${esc(q.from)}</span><span class="pill accent">Waiting</span></div>
            <p class="small"><strong>Q:</strong> ${esc(q.text)}</p>
            <div class="anchor"><span class="label">Checkpoint</span><br />${esc(c.title)} — ${esc(c.clause)}</div>
            <div><p class="label">Suggested reply — edit or send as is</p><textarea rows="3" data-act="answer" data-q="${
              q.id
            }">${esc(q.draft || c.action)}</textarea></div>
            <button class="btn btn-primary btn-sm" type="button" data-act="send" data-q="${q.id}">Send reply</button>
          </article>`;
      })
      .join("");

    return `
      <div class="view-head">
        <p class="eyebrow">Question queue</p>
        <h1>Answer without reopening the assignment</h1>
        <p class="lede">Every question arrives attached to a checkpoint and a paragraph, with a reply already drafted from the standard you wrote. Asynchronous on purpose — an open live chat is unbounded time, and unbounded time is what a sessional tutor does not have.</p>
      </div>
      ${researchBlock()}
      <div class="stack-sm">${cards}</div>`;
  }

  // ---------------------------------------------------------------- render
  const VIEWS = {
    dash: viewDash,
    prepare: viewPrepare,
    feedback: viewFeedback,
    progress: viewProgress,
    setup: viewSetup,
    mark: viewMark,
    cohort: viewCohort,
    questions: viewQuestions,
  };

  function render() {
    document.body.dataset.role = state.role;
    document.querySelectorAll("[data-act='role']").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.role === state.role));
    });
    $("[data-act='research']").setAttribute("aria-pressed", String(state.research));
    renderTabs();
    $("#main").innerHTML = (VIEWS[state.view] || viewDash)();
    if (state.view === "mark" && state.submitted && !state.released) startTimer();
    else stopTimer();
  }

  // ---------------------------------------------------------------- timer
  let timerId = null;
  function startTimer() {
    if (!state.markStart) state.markStart = Date.now();
    if (timerId) return;
    const tick = () => {
      const el = document.getElementById("timer");
      if (!el) return;
      const s = Math.floor((Date.now() - state.markStart) / 1000) + state.markElapsed;
      el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    };
    tick();
    timerId = setInterval(tick, 1000);
  }
  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  // ---------------------------------------------------------------- actions
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    const cp = el.dataset.cp;

    if (act === "role") {
      state.role = el.dataset.role;
      state.view = TABS[state.role][0][0];
      if (state.role === "student" && state.released) state.view = "feedback";
      if (state.role === "tutor" && state.submitted && !state.released) state.view = "mark";
      if (state.role === "tutor" && openQuestions()) state.view = "questions";
      render();
      return;
    }
    if (act === "view") {
      state.view = el.dataset.view;
      render();
      return;
    }
    if (act === "research") {
      state.research = !state.research;
      render();
      return;
    }
    if (act === "reset") {
      stopTimer();
      state = START();
      render();
      toast("Reset — ready for the next test session");
      return;
    }
    if (act === "jump") {
      const to = el.dataset.to;
      if (!state.checkpoints.length) generate();
      state.published = true;
      if (to === "submitted" || to === "released") state.submitted = true;
      if (to === "released") {
        const demo = { "CP-01": "met", "CP-02": "met", "CP-03": "miss", "CP-04": "met", "CP-05": "miss" };
        state.checkpoints.forEach((c) => {
          state.marks[c.id] = demo[c.id] || "met";
          if (state.marks[c.id] !== "met") state.comments[c.id] = c.flaw;
        });
        state.released = true;
      }
      render();
      toast("Jumped to: " + to);
      return;
    }
    if (act === "generate") {
      generate();
      render();
      toast(state.checkpoints.length + " checkpoints drafted — edit before publishing");
      return;
    }
    if (act === "addcp") {
      const n = state.checkpoints.length + 1;
      state.checkpoints.push({
        id: "CP-" + String(n).padStart(2, "0"),
        title: "New checkpoint",
        criterion: "Custom",
        clause: "Describe what a script must show to meet this checkpoint.",
        good: "Describe what good looks like.",
        flaw: "Describe the flaw you expect to see.",
        why: "",
        action: "Describe what the student should do differently.",
        para: Math.min(n, state.draft.length),
        visible: true,
      });
      render();
      return;
    }
    if (act === "removecp") {
      state.checkpoints = state.checkpoints.filter((c) => c.id !== cp);
      render();
      return;
    }
    if (act === "publish") {
      if (!state.checkpoints.length) return;
      state.published = true;
      render();
      toast("Published — students can see the standards now");
      return;
    }
    if (act === "selfcheck") return; // handled on change
    if (act === "runcheck") {
      const text = document.getElementById("checkText").value;
      const id = document.getElementById("checkCp").value;
      const c = cpById(id);
      const out = document.getElementById("checkOut");
      if (!text.trim()) {
        out.innerHTML = `<p class="callout">Paste a paragraph first.</p>`;
        return;
      }
      const res = structureCheck(text, c);
      out.innerHTML = `<div class="panel-quiet stack-sm" style="margin-top:10px">
          <p class="label">${c.id} · ${esc(c.criterion)} · ${res.words} words</p>
          ${res.checks
            .map(
              ([pass, label, ask]) =>
                `<p class="small"><span class="pill ${pass ? "met" : "partly"}">${
                  pass ? "Present" : "Not found"
                }</span> ${esc(label)}${pass ? "" : ` — <span class="muted">${esc(ask)}</span>`}</p>`
            )
            .join("")}
          <p class="tiny">Structure only. Whether the content is any good is your tutor's judgement, not this app's.</p>
        </div>`;
      return;
    }
    if (act === "submit") {
      state.submitted = true;
      state.view = "prepare";
      render();
      toast("Submitted — switch to the tutor role to mark it");
      return;
    }
    if (act === "verdict") {
      const v = el.dataset.v;
      state.marks[cp] = v;
      const c = cpById(cp);
      if (v !== "met" && !state.comments[cp]) state.comments[cp] = c.flaw;
      if (v === "met") delete state.comments[cp];
      render();
      return;
    }
    if (act === "release") {
      state.released = true;
      state.markElapsed = Math.floor((Date.now() - state.markStart) / 1000) + state.markElapsed;
      stopTimer();
      render();
      toast(`Released — ${Math.floor(state.markElapsed / 60)}m ${state.markElapsed % 60}s on this script`);
      return;
    }
    if (act === "ask") {
      const c = cpById(cp);
      state.questions.push({
        id: "q" + Date.now(),
        cp: cp,
        from: "You",
        text: `Can you explain what you meant on ${cp}? I am not sure what to change.`,
        draft: c.action,
        answered: false,
      });
      render();
      toast("Question sent — it arrives attached to " + cp);
      return;
    }
    if (act === "dispute") {
      state.disputed[cp] = true;
      state.questions.push({
        id: "d" + Date.now(),
        cp: cp,
        from: "You (disagreement)",
        text: `I don't think ${cp} applies to my submission — can you point at where you saw it?`,
        draft: `Looking again at paragraph ${cpById(cp).para}.`,
        answered: false,
      });
      render();
      toast("Flagged. Disagreements go to the tutor, and are counted.");
      return;
    }
    if (act === "apply") {
      state.applied[cp] = true;
      render();
      toast("Marked as applied — it stops carrying forward");
      return;
    }
    if (act === "send") {
      const q = state.questions.find((x) => x.id === el.dataset.q);
      const ta = document.querySelector(`[data-act='answer'][data-q='${el.dataset.q}']`);
      q.answer = ta ? ta.value : q.draft;
      q.answered = true;
      q.seconds = 20 + Math.floor(Math.random() * 25);
      render();
      toast("Sent in " + q.seconds + "s — you never reopened the assignment");
      return;
    }
    if (act === "savehandover") {
      render();
      toast("Attached to the checkpoint set for next semester");
      return;
    }
  });

  document.addEventListener("change", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    if (el.dataset.act === "selfcheck") {
      state.selfCheck[el.dataset.cp] = el.checked;
      const done = state.checkpoints.filter((c) => state.selfCheck[c.id]).length;
      const n = document.querySelector(".spread .num");
      if (n) n.textContent = `${done} / ${state.checkpoints.length} self-checked`;
      return;
    }
    if (el.dataset.act === "cpvisible") {
      const c = cpById(el.dataset.cp);
      c.visible = el.checked;
      render();
      return;
    }
  });

  document.addEventListener("input", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "brief") state.brief = el.value;
    if (act === "cptitle") cpById(el.dataset.cp).title = el.value;
    if (act === "cpflaw") cpById(el.dataset.cp).flaw = el.value;
    if (act === "comment") state.comments[el.dataset.cp] = el.value;
    if (act === "handover") state.handover = el.value;
    if (act === "answer") {
      const q = state.questions.find((x) => x.id === el.dataset.q);
      if (q) q.draft = el.value;
    }
  });

  function generate() {
    state.checkpoints = TEMPLATE.map((c) => Object.assign({}, c, { visible: true }));
  }

  render();
</script>

</body></html>
